version: "3.8"

services:
	mariadb:
		image: mariadb
		build: ./requirements/mariadb
		env_file:
			- .env
		volumes:
			- db:/var/lib/mysql
		networks:
			- inception
		restart: unless-stopped

	wordpress:
		image: wordpress
		build: ./requirements/wordpress
		env_file:
			- .env
		depends_on:
			- mariadb
		volumes:
			- wp:/var/www/html
		networks:
			- inception
		restart: unless-stopped

	nginx:
		image: nginx
		build: ./requirements/nginx
		env_file:
			- .env
		depends_on:
			- wordpress
		ports:
			- "443:443"
		volumes:
			- wp:/var/www/html
		networks:
			- inception
		restart: unless-stopped

volumes:
	db:
		driver: local
		driver_opts:
			type: none
			o: bind
			device: /home/${USER}/data/mariadb
	wp:
		driver: local
		driver_opts:
			type: none
			o: bind
			device: /home/${USER}/data/wordpress

networks:
	inception:
		driver: bridge
