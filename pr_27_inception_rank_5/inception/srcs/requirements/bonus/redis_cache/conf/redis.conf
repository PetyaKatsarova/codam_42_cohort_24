bind 0.0.0.0
port 6379
protected-mode no

maxmemory 256mb
maxmemory-policy allkeys-lru

save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

loglevel notice
logfile /var/log/redis/redis.log

# Security: Disable dangerous commands (commented out for plugin setup)
 rename-command FLUSHDB ""
 rename-command FLUSHALL ""
 rename-command CONFIG ""
